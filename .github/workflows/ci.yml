name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      # Before typecheck: a mobile bundle importing @handoff/db typechecks perfectly well.
      - run: pnpm check:boundaries
      - run: pnpm typecheck
      - run: pnpm test:unit

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: handoff
          POSTGRES_DB: handoff_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite creates and drops a database per file, so it needs the cluster owner here.
      DATABASE_URL: postgres://postgres:handoff@localhost:5432/handoff_dev
      DATABASE_MIGRATION_URL: postgres://postgres:handoff@localhost:5432/handoff_dev
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      # HANDOFF_PERF is deliberately unset: the journal performance test measures a runner's disk,
      # not the product, and takes minutes. Run it locally against a known machine instead.
      - run: pnpm test:integration

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:api
      # Each app exports on its own; neither may depend on the other being built first.
      - run: pnpm --filter @handoff/parents export
      - run: pnpm --filter @handoff/daycare export
